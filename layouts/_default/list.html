{{ define "main" }}
  <section aria-labelledby="section-title">
    <h1 id="section-title">{{ .Title }}</h1>

    {{ range .Pages }}
      <article class="post-card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Description }}
          <p>{{ . }}</p>
        {{ end }}
        <p>{{ .Date.Format "January 2, 2006" }}</p>
      </article>
    {{ else }}
      <p>No blog posts found yet.</p>
    {{ end }}
  </section>
{{ end }}
